@if (words$ | async; as words) {
  <div>
    <mat-chip-set aria-label="Common words" role="list">
      @for (word of words.translations; track word) {
        <mat-chip [routerLink]="'/word/' + word.translation">
          {{word.translation}} ({{word.l1 | lowercase}})
        </mat-chip>
      }
    </mat-chip-set>
  </div>
}
